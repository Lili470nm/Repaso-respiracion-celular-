<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="Reto celular: actividad interactiva de repaso sobre biología, metabolismo y respiración celular." />
  <title>Reto celular | Repaso de Biología</title>
  <style>
    :root {
      color-scheme: light;
      --ink:#152c35;--muted:#617782;--teal:#0e766e;--teal-dark:#095950;--mint:#d9f4e9;
      --peach:#ffded0;--bg:#f5f8f7;--line:#dce7e5;--white:#fff;--shadow:0 18px 48px rgba(20,59,57,.07);
      --warn:#8a5313;--warn-bg:#fff1d8;--good:#08744c;--good-bg:#e2f8eb;--bad:#a33141;--bad-bg:#ffeff0;
    }
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.55;color:var(--ink);background:var(--bg)}
    button,input{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #ffb756;outline-offset:3px}
    button:disabled{cursor:not-allowed;opacity:.46}
    .page{min-height:100vh;display:flex;flex-direction:column}
    header{background:#fff;border-bottom:1px solid var(--line)}
    .topbar{max-width:1050px;margin:auto;padding:15px 23px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
    .brand-mark{width:38px;height:38px;border-radius:13px;background:var(--teal);display:grid;place-items:center;color:white;font-size:22px}
    .brand b{display:block;line-height:1.1;font-size:16px;letter-spacing:-.4px}
    .brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
    .top-pill{font-size:12px;font-weight:700;color:var(--teal);background:#eaf7f3;border:1px solid #ccede3;padding:7px 12px;border-radius:30px;white-space:nowrap}
    main{flex:1;width:100%;max-width:1050px;margin:0 auto;padding:34px 23px 48px}
    footer{color:var(--muted);text-align:center;font-size:12px;padding:20px}
    .intro-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:34px;align-items:center;margin:16px 0 28px}
    .eyebrow{font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--teal)}
    h1{font-size:clamp(42px,6vw,70px);line-height:1.04;letter-spacing:-.055em;margin:13px 0 20px}
    h1 span{color:var(--teal)}
    .intro-copy{font-size:17px;max-width:590px;color:#526974;line-height:1.72}
    .hero-art{max-width:390px;width:100%;justify-self:center;filter:drop-shadow(0 17px 28px rgba(6,83,80,.1))}
    .pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:21px 0}
    .pill{display:inline-flex;gap:7px;align-items:center;background:white;border:1px solid var(--line);border-radius:30px;padding:7px 12px;font-size:12px;font-weight:750;color:#45636a}
    .panel{background:white;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px;padding:27px}
    .section-title{font-size:23px;letter-spacing:-.025em;margin:0 0 7px}
    .helper{color:var(--muted);font-size:14px;margin:0 0 20px}
    .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:22px}
    .mode{position:relative;text-align:left;padding:18px;border:2px solid var(--line);border-radius:17px;background:white;min-height:136px;transition:.16s}
    .mode:hover{border-color:#8fc9bd;transform:translateY(-1px)}
    .mode.selected{border-color:var(--teal);background:#f0faf6;box-shadow:0 0 0 2px rgba(14,118,110,.08)}
    .mode-icon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:#e2f4ec;color:var(--teal);font-size:18px}
    .mode strong{display:block;margin:7px 0 4px;font-size:16px}
    .mode small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
    .name-grid{display:flex;align-items:flex-end;gap:13px;flex-wrap:wrap}
    .name-field{flex:1;min-width:210px}
    .name-field label{font-size:13px;font-weight:750;display:block;margin-bottom:7px}
    .name-field input{display:block;width:100%;border:1px solid #cbded9;border-radius:12px;background:#fff;padding:13px 15px;color:var(--ink)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:750;border-radius:12px;padding:13px 20px;border:1px solid transparent;min-height:50px;transition:.15s;text-align:center;text-decoration:none}
    .btn-primary{background:var(--teal);color:#fff}
    .btn-primary:not(:disabled):hover{background:var(--teal-dark);transform:translateY(-1px)}
    .btn-outline{color:var(--ink);background:white;border-color:#cbded9}
    .btn-outline:not(:disabled):hover{background:#f1f8f6;border-color:#8bc8bb}
    .btn-quiet{color:var(--teal);background:transparent}
    .micro{margin-top:13px;color:var(--muted);font-size:12px}
    .quiz-layout{max-width:820px;margin:0 auto}
    .quiz-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;flex-wrap:wrap}
    .small-heading{font-size:22px;letter-spacing:-.03em;margin:0}
    .muted{color:var(--muted)}
    .kicker{color:var(--teal);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.09em}
    .quiz-meta{text-align:right;font-size:13px;color:var(--muted)}
    .quiz-meta strong{color:var(--ink);display:block;font-size:15px}
    .progress{height:9px;background:#deebe7;border-radius:12px;overflow:hidden;margin:19px 0 20px}
    .progress-fill{height:100%;background:linear-gradient(90deg,#0e766e,#46b39e);border-radius:12px;transition:width .25s}
    .question-card{background:#fff;border-radius:23px;border:1px solid var(--line);padding:31px 33px;box-shadow:var(--shadow)}
    .q-label{display:flex;align-items:center;gap:9px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
    .category{background:#e8f5ef;color:#167264;border-radius:30px;padding:6px 11px;font-size:12px;font-weight:750}
    .qcount{font-size:12px;color:var(--muted);font-weight:700}
    .question{font-size:clamp(22px,3vw,28px);letter-spacing:-.024em;line-height:1.32;margin:0 0 25px;font-weight:760}
    .options{display:grid;gap:11px}
    .option{display:flex;align-items:center;gap:14px;width:100%;border:1.5px solid #deebe7;border-radius:14px;background:#fff;padding:14px 16px;text-align:left;color:var(--ink);min-height:65px;transition:.14s}
    .option:not(:disabled):hover{background:#f5fbf8;border-color:#85c4b5}
    .option .letter{flex:0 0 35px;height:35px;border-radius:11px;background:#edf2f1;display:grid;place-items:center;font-weight:800;color:#526973}
    .option .opt-text{flex:1}
    .option .symbol{font-weight:850;margin-left:auto}
    .option.is-selected{border-color:var(--teal);background:#eaf7f1}
    .option.is-selected .letter{background:var(--teal);color:#fff}
    .option.is-right{border-color:#40aa79;background:var(--good-bg)}
    .option.is-right .letter{background:var(--good);color:white}
    .option.is-wrong{border-color:#df8991;background:var(--bad-bg)}
    .option.is-wrong .letter{background:var(--bad);color:white}
    .option:disabled{opacity:1;cursor:default}
    .feedback{margin-top:20px;padding:18px 20px;border-radius:14px;border:1px solid #9bd2ad;background:var(--good-bg)}
    .feedback.is-wrong{background:var(--bad-bg);border-color:#e6b8bc}
    .feedback strong{display:block;margin-bottom:4px}
    .feedback p{margin:0;font-size:14px;line-height:1.6}
    .quiz-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:19px;flex-wrap:wrap}
    .question-map{margin-top:24px;border:1px solid var(--line);border-radius:17px;background:white;padding:16px 19px}
    .question-map summary{cursor:pointer;font-size:14px;font-weight:750}
    .question-map p{font-size:12px;color:var(--muted)}
    .number-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:9px}
    .numbtn{width:100%;aspect-ratio:1;border-radius:10px;border:1px solid #cbded9;background:white;color:#5a6c72;font-size:13px;font-weight:800}
    .numbtn.current{outline:2px solid #176f65;outline-offset:2px}
    .numbtn.answered{background:#e1f5ed;color:#0c6652;border-color:#79c8a8}
    .numbtn.current.answered{background:#0e766e;color:#fff}
    .incomplete{background:var(--warn-bg);color:var(--warn);border:1px solid #efcc8b;border-radius:12px;padding:13px 15px;font-size:13px;font-weight:650;margin-top:14px}
    .result-hero{text-align:center;padding:30px 20px 23px;background:linear-gradient(135deg,#e2f5ec,#f6fbfa 65%,#ffefe5);border-radius:21px;border:1px solid #cfe9df}
    .result-big{font-weight:850;letter-spacing:-.065em;font-size:clamp(67px,10vw,100px);line-height:1;color:var(--teal);margin:10px 0}
    .result-big span{font-size:28px;color:#679188;letter-spacing:-.025em}
    .result-hero h2{font-size:24px;margin:8px 0 4px}
    .result-hero p{font-size:14px;color:#526974;margin:0}
    .result-stats{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:18px 0}
    .result-stats span{background:white;padding:8px 13px;border:1px solid var(--line);border-radius:30px;font-size:12px;font-weight:750}
    .results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0}
    .results-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
    .result-panel{border:1px solid var(--line);border-radius:18px;background:white;padding:21px}
    .result-panel h3{font-size:19px;letter-spacing:-.02em;margin:0 0 16px}
    .topic-item{margin-bottom:17px}
    .topic-top{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:7px}
    .topic-top span{color:var(--muted)}
    .topic-meter{height:7px;border-radius:10px;background:#e6eeeb;overflow:hidden}
    .topic-meter >div{height:100%;background:#27a887;border-radius:10px}
    .review-list{margin-top:26px}
    .review-list h3{font-size:22px;letter-spacing:-.03em;margin:0 0 7px}
    .review-item{border:1px solid var(--line);border-radius:15px;background:white;margin:11px 0;padding:17px 19px}
    .review-item .tag{font-size:11px;font-weight:800;color:var(--muted)}
    .review-item .tag.bad{color:var(--bad)}
    .review-item .tag.good{color:var(--good)}
    .review-item h4{font-size:15px;line-height:1.5;margin:8px 0}
    .review-item p{margin:7px 0;font-size:13px;line-height:1.55}
    .review-item .explain{color:var(--muted);margin-top:10px}
    .link-btn{border:0;background:transparent;color:var(--teal);font-weight:780;padding:5px 0;text-decoration:underline;text-underline-offset:3px}
    .print-only{display:none}
    @media (max-width:720px){
      main{padding:20px 14px 28px}.topbar{padding:13px 15px}.intro-grid{grid-template-columns:1fr;gap:0;margin:12px 0}
      .hero-art{max-width:250px;grid-row:1;margin-bottom:4px}.intro-copy{font-size:15px}h1{font-size:49px;margin:9px 0 12px}
      .panel{padding:19px}.mode-grid{gap:9px}.mode{padding:12px;min-height:160px}.mode small{font-size:11px}
      .question-card{padding:21px 16px}.quiz-head{align-items:flex-end}.question{font-size:21px}.option{padding:12px;gap:10px;min-height:63px;font-size:14px}
      .quiz-controls .btn{padding:11px 13px;font-size:13px}.number-grid{grid-template-columns:repeat(5,1fr)}
      .results-grid{grid-template-columns:1fr}.result-panel{padding:18px}
    }
    @media (max-width:390px){.top-pill{font-size:10px;padding:6px 8px}.brand b{font-size:14px}.mode-grid{grid-template-columns:1fr}.mode{min-height:auto}.hero-art{max-width:215px}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
    @media print{
      body{background:#fff;font-size:11pt;color:#000} header,.hide-print,.btn,.question-map,footer{display:none!important}
      main{max-width:100%;padding:0}.results-grid{grid-template-columns:1fr 1fr}.result-hero{padding:14px}.result-big{font-size:48px}
      .review-item,.result-panel{break-inside:avoid}.print-only{display:block}.review-list{margin-top:12px}
    }
  </style>
</head>
<body>
<div class="page">
  <header>
    <div class="topbar">
      <a class="brand" href="#" id="homeLink" aria-label="Ir al inicio de Reto celular">
        <span class="brand-mark" aria-hidden="true">⌬</span>
        <span><b>RETO CELULAR</b><small>Repaso interactivo</small></span>
      </a>
      <span class="top-pill">BIOLOGÍA · 20 PREGUNTAS</span>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer>Biología · Aprender, practicar y comprender · Funciona sin conexión después de descargar el archivo.</footer>
</div>
<script>
'use strict';
// Preguntas tomadas del cuestionario docente. No se requieren librerías ni servicios externos.
const QUESTIONS = [
  {
    "number": 1,
    "question": "¿Qué característica distingue a una célula eucariota de una procariota?",
    "options": [
      "Tiene membrana plasmática",
      "Posee núcleo delimitado por una membrana",
      "Contiene citoplasma",
      "Utiliza material genético"
    ],
    "correct": 1,
    "explanation": "Las eucariotas poseen núcleo delimitado por membrana.",
    "category": "Tipos de células"
  },
  {
    "number": 2,
    "question": "¿Cuál de las siguientes estructuras está presente tanto en células procariotas como eucariotas?",
    "options": [
      "Núcleo",
      "Mitocondria",
      "Ribosomas",
      "Aparato de Golgi"
    ],
    "correct": 2,
    "explanation": "Ambas poseen ribosomas para sintetizar proteínas.",
    "category": "Tipos de células"
  },
  {
    "number": 3,
    "question": "¿En qué tipo de células se encuentran las mitocondrias?",
    "options": [
      "Solo bacterianas",
      "Eucariotas",
      "Todas las procariotas",
      "Solo arqueas"
    ],
    "correct": 1,
    "explanation": "Las mitocondrias son orgánulos de células eucariotas.",
    "category": "Tipos de células"
  },
  {
    "number": 4,
    "question": "¿Cuál de los siguientes procesos es anabólico?",
    "options": [
      "Degradación de glucosa",
      "Descomposición de grasas",
      "Síntesis de proteínas",
      "Oxidación de piruvato"
    ],
    "correct": 2,
    "explanation": "El anabolismo construye moléculas complejas a partir de otras más simples.",
    "category": "Metabolismo celular"
  },
  {
    "number": 5,
    "question": "¿Qué describe mejor el catabolismo?",
    "options": [
      "Construcción de moléculas complejas",
      "Degradación de moléculas con liberación de energía",
      "Duplicación exclusiva del ADN",
      "Transporte pasivo de agua"
    ],
    "correct": 1,
    "explanation": "El catabolismo descompone moléculas y puede liberar energía aprovechable.",
    "category": "Metabolismo celular"
  },
  {
    "number": 6,
    "question": "¿Cuál es la principal función del ATP en la célula?",
    "options": [
      "Almacenar información hereditaria",
      "Transportar oxígeno en la sangre",
      "Proporcionar energía para procesos celulares",
      "Formar la membrana nuclear"
    ],
    "correct": 2,
    "explanation": "El ATP transfiere energía para impulsar distintas funciones celulares.",
    "category": "Metabolismo celular"
  },
  {
    "number": 7,
    "question": "¿Cuál es el orden correcto de las cuatro etapas principales de la respiración aeróbica?",
    "options": [
      "Krebs, glucólisis, cadena de electrones, oxidación del piruvato",
      "Glucólisis, oxidación del piruvato, Krebs, cadena transportadora de electrones",
      "Glucólisis, Krebs, fermentación, fotosíntesis",
      "Cadena de electrones, glucólisis, Krebs, oxidación del piruvato"
    ],
    "correct": 1,
    "explanation": "La respiración aeróbica inicia con glucólisis y termina con fosforilación oxidativa.",
    "category": "Etapas de la respiración"
  },
  {
    "number": 8,
    "question": "¿En qué parte de una célula eucariota ocurre la glucólisis?",
    "options": [
      "Matriz mitocondrial",
      "Membrana mitocondrial interna",
      "Citosol",
      "Núcleo"
    ],
    "correct": 2,
    "explanation": "La glucólisis ocurre en el citosol.",
    "category": "Etapas de la respiración"
  },
  {
    "number": 9,
    "question": "¿Cuál es el producto principal de la glucólisis que continúa hacia la mitocondria?",
    "options": [
      "Acetil-CoA directamente",
      "Piruvato",
      "Oxígeno",
      "Agua"
    ],
    "correct": 1,
    "explanation": "La glucólisis produce piruvato, que puede oxidarse a acetil-CoA.",
    "category": "Etapas de la respiración"
  },
  {
    "number": 10,
    "question": "¿Qué sucede durante la oxidación del piruvato?",
    "options": [
      "Se forma glucosa",
      "Se produce acetil-CoA y se libera CO₂",
      "Se consume ATP para producir almidón",
      "El oxígeno se convierte directamente en glucosa"
    ],
    "correct": 1,
    "explanation": "El piruvato se transforma en acetil-CoA y genera NADH y CO₂.",
    "category": "Etapas de la respiración"
  },
  {
    "number": 11,
    "question": "¿En dónde ocurre el ciclo de Krebs en células eucariotas?",
    "options": [
      "Citosol",
      "Núcleo",
      "Matriz mitocondrial",
      "Membrana plasmática"
    ],
    "correct": 2,
    "explanation": "En las células eucariotas, Krebs ocurre en la matriz mitocondrial.",
    "category": "Ciclo de Krebs"
  },
  {
    "number": 12,
    "question": "¿Cuál es una función importante del ciclo de Krebs?",
    "options": [
      "Producir principalmente NADH y FADH₂",
      "Fabricar oxígeno",
      "Duplicar cromosomas",
      "Transformar ATP en ADN"
    ],
    "correct": 0,
    "explanation": "Krebs produce transportadores reducidos de electrones y libera CO₂.",
    "category": "Ciclo de Krebs"
  },
  {
    "number": 13,
    "question": "¿Qué moléculas llevan electrones de alta energía hacia la cadena transportadora?",

      "NADH y FADH₂",
      "Glucosa y almidón",

    "correct": 1,
    "explanation": "NADH y FADH₂ transfieren electrones a la cadena respiratoria.",
    "category": "Cadena de electrones"
  },
  {
    "number": 14,
    "question": "¿Dónde se encuentra la cadena transportadora de electrones en células eucariotas?",
    "options": [
      "Membrana mitocondrial interna",
      "Citosol",
      "Membrana nuclear",
      "Lisosoma"
    ],
    "correct": 0,
    "explanation": "Sus complejos están incrustados en la membrana mitocondrial interna.",

  },
  {
    "number": 15,
    "question": "¿Cuál es la función del oxígeno al final de la cadena transportadora de electrones?",

      "Aportar carbono al ciclo de Krebs",
      "Ser el aceptor final de electrones y contribuir a formar agua",
      "Convertirse en ATP directamente",
      "Descomponer ribosomas"

    "correct": 1,
    "explanation": "El oxígeno recibe electrones y protones para formar agua.",
    "category": "Cadena de electrones"
  },
  {
    "number": 16,
    "question": "¿Qué hace la ATP sintasa durante la fosforilación oxidativa?",
    "options": [
      "Utiliza el gradiente de protones para formar ATP",
      "Produce glucosa con CO₂",
      "Rompe el ADN",
      "Transporta piruvato al núcleo"
    ],
    "correct": 0,
    "explanation": "La ATP sintasa aprovecha la fuerza protón-motriz para producir ATP.",
    "category": "Cadena de electrones"
  },
  {
    "number": 17,
    "question": "Si se interrumpe el suministro de oxígeno a una célula humana, ¿qué proceso se afecta directamente?",
    "options": [
      "Transcripción del ADN",
      "Funcionamiento de la cadena transportadora de electrones",
      "Difusión de agua por ósmosis",
      "Síntesis de lípidos en el retículo"
    ],
    "correct": 1,
    "explanation": "Sin aceptor final de electrones, la cadena respiratoria se detiene.",
    "category": "Cadena de electrones"
  },
  {
    "number": 18,
    "question": "¿Qué etapa produce la mayor parte del ATP durante la respiración aeróbica?",
    "options": [
      "Glucólisis",
      "Oxidación del piruvato",
      "Ciclo de Krebs",
      "Fosforilación oxidativa"
    ],
    "correct": 3,
    "explanation": "La mayor parte del ATP se produce mediante fosforilación oxidativa.",
    "category": "Cadena de electrones"
  },
  {
    "number": 19,
    "question": "Una célula de la encía necesita energía para reparar tejido. ¿Qué molécula utiliza directamente como fuente inmediata de energía?",
    "options": [
      "ATP",
      "ADN",
      "CO₂",
      "Oxígeno molecular"
    ],
    "correct": 0,
    "explanation": "La energía inmediata para muchas tareas celulares se suministra mediante ATP.",
    "category": "Aplicación en Odontología"
  },
  {
    "number": 20,
    "question": "Un tejido bucal inflamado recibe menos oxígeno. ¿Cuál sería una consecuencia posible en sus células?",
    "options": [
      "Aumento automático de la fosforilación oxidativa",
      "Menor producción de ATP por respiración aeróbica",
      "Desaparición inmediata del núcleo",
      "Conversión directa del CO₂ en glucosa"
    ],
    "correct": 1,
    "explanation": "La disminución del oxígeno puede limitar la fosforilación oxidativa y la producción de ATP.",
    "category": "Aplicación en Odontología"
  }
];
const LETTERS = ['A','B','C','D'];
const TIPS = {
  'Tipos de células': 'Repasa las diferencias entre procariotas y eucariotas y sus estructuras compartidas.',
  'Metabolismo celular': 'Distingue anabolismo, catabolismo y el papel del ATP.',
  'Etapas de la respiración': 'Practica el orden, los productos y la localización de cada etapa.',
  'Ciclo de Krebs': 'Revisa dónde ocurre y qué moléculas transportadoras produce.',
  'Cadena de electrones': 'Revisa el papel del oxígeno, NADH, FADH₂, el gradiente de protones y la ATP sintasa.',
  'Aplicación en Odontología': 'Relaciona la disponibilidad de oxígeno y ATP con la actividad de tejidos bucales.'
};
const state = {view:'intro',mode:'practice',name:'',index:0,answers:Array(QUESTIONS.length).fill(null),startedAt:0,finishedAt:0,onlyMistakes:true,notice:''};
const app = document.getElementById('app');
const encode = (s) => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numAnswered = () => state.answers.filter(x=>x!==null).length;
const numCorrect = () => state.answers.reduce((n,x,i)=>n+(x===QUESTIONS[i].correct?1:0),0);
const resultScore = () => numCorrect()*5;
const elapsed = () => Math.max(0,Math.round(((state.finishedAt||Date.now())-state.startedAt)/1000));
const formatDuration = (s) => `${Math.floor(s/60)} min ${s%60} s`;
function intro(){
 app.innerHTML=`
 <section class="intro-grid">
  <div>
   <span class="eyebrow">Pon a prueba lo que aprendiste</span>
   <h1>Reto <span>celular.</span></h1>
   <p class="intro-copy">De las células al ATP: explora la respiración celular, el ciclo de Krebs y la cadena transportadora de electrones con preguntas que conectan la biología y la Odontología.</p>
   <div class="pill-row"><span class="pill">◉ 20 preguntas</span><span class="pill">✦ 5 puntos cada una</span><span class="pill">◷ 20–25 min aprox.</span></div>
  </div>
  <svg class="hero-art" viewBox="0 0 440 350" role="img" aria-label="Ilustración de una mitocondria">
   <defs><linearGradient id="blob" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9f4e9"/><stop offset="1" stop-color="#dcebf8"/></linearGradient><linearGradient id="mito" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e766e"/><stop offset="1" stop-color="#1fb49c"/></linearGradient></defs>
   <path d="M45 106C66 40 169 23 236 35c75 13 144 73 155 139 12 70-23 116-95 138-60 19-179 9-226-38C28 232 27 161 45 106Z" fill="url(#blob)"/>
   <circle cx="78" cy="68" r="10" fill="#ffc5ac"/><circle cx="363" cy="80" r="14" fill="#a7dbc9"/><circle cx="376" cy="266" r="7" fill="#ffc5ac"/>
   <g transform="rotate(-19 218 181)"><rect x="73" y="104" width="294" height="152" rx="76" fill="url(#mito)"/>
   <rect x="87" y="117" width="267" height="126" rx="63" fill="#d7f8e9" stroke="#a2e0c8" stroke-width="3"/>
   <path d="M119 167c17-37 36-31 49 0 14 36 29 37 41 2 12-36 33-37 48 1 14 38 32 34 46-4 11-30 25-21 31 9" fill="none" stroke="#12877b" stroke-width="12" stroke-linecap="round"/>
   <path d="M121 191c15-31 34-22 46 6 14 29 30 27 43-4 13-31 33-28 46 4 16 29 31 26 45-5 10-21 22-18 31 1" fill="none" stroke="#43bba6" stroke-width="8" stroke-linecap="round"/>
   </g><g fill="#e89e77"><circle cx="117" cy="297" r="5"/><circle cx="145" cy="311" r="4"/><circle cx="331" cy="42" r="5"/></g>
   <g transform="translate(324 284)"><circle r="32" fill="#fff" stroke="#d4eee7" stroke-width="3"/><path d="m-10 0 9 9 16-19" stroke="#0e766e" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </svg>
 </section>
 <section class="panel" aria-labelledby="startTitle">
  <h2 id="startTitle" class="section-title">Elige cómo quieres repasar</h2>
  <p class="helper">Las mismas 20 preguntas, dos maneras de aprender.</p>
  <div class="mode-grid" role="group" aria-label="Modalidad de la actividad">
   <button type="button" class="mode ${state.mode==='practice'?'selected':''}" data-action="mode" data-mode="practice" aria-pressed="${state.mode==='practice'}"><span class="mode-icon">✎</span><strong>Modo práctica</strong><small>Recibe la respuesta correcta y una explicación después de elegir.</small></button>
   <button type="button" class="mode ${state.mode==='challenge'?'selected':''}" data-action="mode" data-mode="challenge" aria-pressed="${state.mode==='challenge'}"><span class="mode-icon">★</span><strong>Modo reto</strong><small>Responde todo primero. Conoce tu resultado al finalizar.</small></button>
  </div>
  <div class="name-grid"><div class="name-field"><label for="studentName">Nombre del estudiante <span class="muted">(opcional)</span></label><input type="text" id="studentName" placeholder="Escribe tu nombre" maxlength="85" autocomplete="name" value="${encode(state.name)}"/></div><button class="btn btn-primary" type="button" data-action="start">Comenzar reto <span aria-hidden="true">→</span></button></div>
  <p class="micro">No necesitas crear una cuenta. Tus respuestas se procesan en este dispositivo y no se envían a ningún servidor.</p>
 </section>`;
}
function quiz(){
 const i=state.index,q=QUESTIONS[i],picked=state.answers[i],graded=state.mode==='practice'&&picked!==null;
 const progress=Math.round(numAnswered()/QUESTIONS.length*100);
 const answers=q.options.map((option,j)=>{
  const right=graded&&j===q.correct,wrong=graded&&picked===j&&j!==q.correct;
  const selected=picked===j;
  return `<button type="button" class="option ${right?'is-right':wrong?'is-wrong':selected?'is-selected':''}" data-action="pick" data-index="${j}" ${graded?'disabled':''} aria-pressed="${selected}" aria-label="Opción ${LETTERS[j]}: ${encode(option)}">
   <span class="letter">${LETTERS[j]}</span><span class="opt-text">${encode(option)}</span>${graded&&(right||wrong)?`<span class="symbol" aria-label="${right?'Correcta':'Incorrecta'}">${right?'✓':'×'}</span>`:''}
  </button>`;
 }).join('');
 const finishedStep=i===QUESTIONS.length-1;
 const nextLabel=finishedStep?'Ver resultados':'Siguiente pregunta →';
 const showIncomplete=state.notice?`<div class="incomplete" role="status">${encode(state.notice)}</div>`:'';
 app.innerHTML=`<section class="quiz-layout">
  <div class="quiz-head"><div><div class="kicker">${state.mode==='practice'?'Modo práctica':'Modo reto'}</div><h1 class="small-heading">¡Piensa antes de responder!</h1></div><div class="quiz-meta"><strong>${numAnswered()} de ${QUESTIONS.length} respondidas</strong><span>Valor: 5 puntos por pregunta</span></div></div>
  <div class="progress" role="progressbar" aria-label="Progreso de respuestas" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}"><div class="progress-fill" style="width:${progress}%"></div></div>
  <div class="question-card"><div class="q-label"><span class="category">${encode(q.category)}</span><span class="qcount">Pregunta ${i+1} de ${QUESTIONS.length}</span></div>
   <h2 class="question" id="questionTitle">${encode(q.question)}</h2>
   <div class="options" role="group" aria-labelledby="questionTitle">${answers}</div>
   ${graded?`<div class="feedback ${picked!==q.correct?'is-wrong':''}" role="status"><strong>${picked===q.correct?'¡Correcto! Muy bien.':'Todavía hay algo por repasar.'}</strong><p>${encode(q.explanation)}</p></div>`:''}
  </div>
  ${showIncomplete}
  <div class="quiz-controls hide-print"><button class="btn btn-outline" type="button" data-action="back" ${i===0?'disabled':''}>← Anterior</button>
   <button class="btn btn-primary" type="button" data-action="next" ${state.mode==='practice'&&picked===null?'disabled':''}>${nextLabel}</button></div>
  <details class="question-map hide-print"><summary>Ver mapa de las 20 preguntas</summary><p>Verde = respondida · Contorno = pregunta actual. Puedes volver a revisar tus respuestas.</p>
   <div class="number-grid">${QUESTIONS.map((_,j)=>`<button type="button" aria-label="Ir a pregunta ${j+1}${state.answers[j]!==null?', respondida':''}" class="numbtn ${j===i?'current':''} ${state.answers[j]!==null?'answered':''}" data-action="goto" data-question="${j}" ${state.mode==='practice'&&j>state.answers.findIndex(x=>x===null)&&state.answers.some(x=>x===null)?'disabled':''}>${j+1}</button>`).join('')}</div>
  </details>
 </section>`;
}
function results(){
 const n=numCorrect(),score=resultScore(),date=new Date();
 const status=score>=90?['¡Excelente dominio!','Has comprendido muy bien los contenidos.']:score>=70?['¡Buen trabajo!','Vas por muy buen camino. Revisa tus errores para afianzar lo aprendido.']:score>=50?['¡Sigue practicando!','Ya dominas una parte. Repasa los temas con más errores.']:['Cada intento cuenta','Revisa las explicaciones y vuelve a intentarlo.'];
 const topicStats=[...new Set(QUESTIONS.map(q=>q.category))].map(t=>{
  const ids=QUESTIONS.map((q,i)=>q.category===t?i:-1).filter(x=>x!==-1);
  const good=ids.filter(i=>state.answers[i]===QUESTIONS[i].correct).length;
  return {title:t,total:ids.length,good,pct:Math.round(good/ids.length*100)};
 });
 const weakest=[...topicStats].filter(x=>x.pct<100).sort((a,b)=>a.pct-b.pct).slice(0,2);
 const relevant=QUESTIONS.map((q,i)=>({...q,index:i})).filter(q=>!state.onlyMistakes||state.answers[q.index]!==q.correct);
 app.innerHTML=`<div class="quiz-layout">
  <section class="result-hero"><span class="eyebrow">Reto finalizado</span><h2>${status[0]}</h2><p>${status[1]}</p><div class="result-big">${score}<span> / 100</span></div>
   <div class="result-stats"><span>✓ ${n} correctas</span><span>✎ ${QUESTIONS.length-n} por reforzar</span><span>◷ ${formatDuration(elapsed())}</span></div>
   <p>${state.name?`Estudiante: <strong>${encode(state.name)}</strong> · `:''}${date.toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'})}</p>
  </section>
  <div class="results-actions hide-print"><button class="btn btn-primary" type="button" data-action="download">↓ Descargar reporte</button><button class="btn btn-outline" type="button" data-action="print">Imprimir / guardar PDF</button><button class="btn btn-outline" type="button" data-action="retry">↻ Volver a intentarlo</button></div>
  <div class="results-grid">
   <div class="result-panel"><h3>Tu avance por tema</h3>${topicStats.map(t=>`<div class="topic-item"><div class="topic-top"><strong>${encode(t.title)}</strong><span>${t.good}/${t.total}</span></div><div class="topic-meter" role="progressbar" aria-label="${encode(t.title)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${t.pct}"><div style="width:${t.pct}%"></div></div></div>`).join('')}</div>
   <div class="result-panel"><h3>¿Qué debes repasar?</h3>${weakest.length?weakest.map(t=>`<p><strong>${encode(t.title)}</strong><br/><span class="muted">${encode(TIPS[t.title])}</span></p>`).join(''):'<p>¡Respondiste todo correctamente! Puedes ayudar a alguien de tu grupo a repasar o explicar las etapas con tus palabras.</p>'}<p class="muted" style="font-size:12px;margin-top:18px">Consulta la revisión de respuestas para ver explicaciones.</p></div>
  </div>
  <section class="review-list"><h3>Revisión de respuestas</h3><div class="hide-print"><button type="button" class="link-btn" data-action="toggleReview">${state.onlyMistakes?'Mostrar todas las preguntas':'Mostrar solo mis errores'}</button></div>
   ${relevant.length?relevant.map(q=>{
    const idx=q.index,picked=state.answers[idx],ok=picked===q.correct;
    return `<div class="review-item"><span class="tag ${ok?'good':'bad'}">Pregunta ${idx+1} · ${ok?'Correcta':'Por reforzar'}</span><h4>${encode(q.question)}</h4><p><b>Tu respuesta:</b> ${LETTERS[picked]}. ${encode(q.options[picked])}</p>${!ok?`<p><b>Respuesta correcta:</b> ${LETTERS[q.correct]}. ${encode(q.options[q.correct])}</p>`:''}<p class="explain"><b>Explicación:</b> ${encode(q.explanation)}</p></div>`;
   }).join(''):'<p>¡No hubo errores! Selecciona «Mostrar todas las preguntas» para revisar el cuestionario completo.</p>'}
  </section>
  <p class="micro hide-print">Este sitio no almacena ni envía las calificaciones. Si tu docente solicita evidencia, descarga el reporte o guárdalo como PDF y envíalo por el medio indicado.</p>
  <p class="print-only">Reporte generado localmente. Actividad: Reto celular · ${score} puntos de 100.</p>
 </div>`;
}
function render(){
 if(state.view==='intro')intro(); else if(state.view==='quiz')quiz(); else results();
}
function jump(i){state.index=i;state.notice='';render();window.scrollTo({top:0,behavior:'smooth'});}
function restart(){state.view='intro';state.index=0;state.answers=Array(QUESTIONS.length).fill(null);state.finishedAt=0;state.notice='';state.onlyMistakes=true;render();window.scrollTo(0,0);}
function report(){
 const now=new Date();
 const out=[
 'RETO CELULAR — REPASO DE BIOLOGÍA',
 `Estudiante: ${state.name||'Sin nombre'}`,
 `Fecha: ${now.toLocaleString('es-MX')}`,
 `Modalidad: ${state.mode==='practice'?'Práctica':'Reto'}`,
 `Resultado: ${resultScore()}/100`,
 `Respuestas correctas: ${numCorrect()}/${QUESTIONS.length}`,
 `Duración: ${formatDuration(elapsed())}`,
 '', 'DETALLE DE RESPUESTAS', ''
 ];
 QUESTIONS.forEach((q,i)=>{
  const picked=state.answers[i];
  out.push(`${i+1}. ${q.question}`);
  out.push(`Respuesta seleccionada: ${LETTERS[picked]}. ${q.options[picked]} — ${picked===q.correct?'CORRECTA':'INCORRECTA'}`);
  out.push(`Respuesta correcta: ${LETTERS[q.correct]}. ${q.options[q.correct]}`);
  out.push(`Explicación: ${q.explanation}`,'');
 });
 const text='\ufeff'+out.join('\n');
 const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
 const url=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=url;link.download='Reto_celular_resultados.txt';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
// Delegación de eventos: funciona incluso al cambiar de pantalla.
document.addEventListener('click',event=>{
 const target=event.target.closest('[data-action]');if(!target)return;
 const action=target.dataset.action;
 if(action==='mode'){state.mode=target.dataset.mode;state.name=document.getElementById('studentName')?.value||state.name;render();}
 if(action==='start'){
  state.name=(document.getElementById('studentName')?.value||'').trim();
  state.startedAt=Date.now();state.finishedAt=0;state.view='quiz';state.index=0;state.answers=Array(QUESTIONS.length).fill(null);state.notice='';render();window.scrollTo(0,0);
 }
 if(action==='pick'){
  const idx=Number(target.dataset.index),i=state.index;
  if(state.view!=='quiz'||(state.mode==='practice'&&state.answers[i]!==null))return;
  state.answers[i]=idx;state.notice='';render();
 }
 if(action==='back'&&state.index>0)jump(state.index-1);
 if(action==='goto'){
  const i=Number(target.dataset.question);
  if(state.mode==='practice'){
   const first=state.answers.findIndex(x=>x===null);
   if(first!==-1&&i>first)return;
  }
  jump(i);
 }
 if(action==='next'){
  if(state.mode==='practice'&&state.answers[state.index]===null)return;
  if(state.index<QUESTIONS.length-1){jump(state.index+1);return;}
  if(numAnswered()!==QUESTIONS.length){
   const missing=QUESTIONS.length-numAnswered();
   state.notice=`Faltan ${missing} ${missing===1?'pregunta':'preguntas'} por responder. Te llevamos a la primera pendiente.`;
   const first=state.answers.findIndex(x=>x===null);state.index=first;render();window.scrollTo(0,0);return;
  }
  state.finishedAt=Date.now();state.view='results';state.onlyMistakes=true;render();window.scrollTo(0,0);
 }
 if(action==='download')report();
 if(action==='print')window.print();
 if(action==='retry')restart();
 if(action==='toggleReview'){state.onlyMistakes=!state.onlyMistakes;render();}
});
document.getElementById('homeLink').addEventListener('click',e=>{
 e.preventDefault();if(state.view==='intro')return;
 if(confirm('¿Quieres volver al inicio? Se perderán las respuestas de este intento.'))restart();
});
render();
</script>
